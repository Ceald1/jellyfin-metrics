apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-metrics
#  namespace: default
  labels:
    app: jellyfin-metrics
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jellyfin-metrics
  template:
    metadata:
      labels:
        app: jellyfin-metrics
    spec:
      securityContext:
        fsGroup: 65532
      containers:
      - name: jellyfin-metrics
        image: ghcr.io/ceald1/jellyfin-metrics:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 2112
        volumeMounts:
        - name: env-volume
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        readinessProbe:
          httpGet:
            path: /metrics
            port: 2112
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /metrics
            port: 2112
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: env-volume
        secret:
          secretName: env-secret
          defaultMode: 0440



